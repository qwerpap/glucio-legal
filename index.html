<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Glucio legal and support.">
<title>Glucio | Glucio</title>
<style>

:root{--bg:#FFFFFF;--tint:#F1F6E7;--ink:#1C2616;--soft:#5B6753;--leaf:#3F7A22;--line:#DCE5CE;--warn:#B06F0C;--warnbg:#FFF4DC}
@media (prefers-color-scheme:dark){:root{--bg:#10130C;--tint:#1B2214;--ink:#E8EDDA;--soft:#9BA68E;--leaf:#8CC65E;--line:#2F3A24;--warn:#E8A93A;--warnbg:#2A2210}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
a{color:var(--leaf);font-weight:600}
.top{background:var(--tint);border-bottom:1px solid var(--line)}
.top div{max-width:900px;margin:0 auto;padding:16px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top strong{font-size:18px;margin-right:auto;color:var(--leaf)}
.top a{font-size:14px;font-weight:500;text-decoration:none;color:var(--ink);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
.top a.on{background:var(--leaf);color:var(--bg);border-color:var(--leaf)}
main{max-width:900px;margin:0 auto;padding:36px 20px 70px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--soft);margin:0 0 28px}
dl{margin:0;display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:0 28px}
dt{font-weight:700;padding:16px 0;border-top:1px solid var(--line)}
dd{margin:0;padding:16px 0;border-top:1px solid var(--line)}
dd p{margin:0 0 10px}dd ul{margin:0 0 10px;padding-left:20px}
.box{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;padding:14px 18px;margin:0 0 26px}
.box b{color:var(--warn)}
.ok{background:var(--tint);border-radius:12px;padding:14px 18px;margin:0 0 26px}
code{background:var(--tint);padding:1px 6px;border-radius:5px;font-size:14px}
footer{max-width:900px;margin:0 auto;padding:0 20px 40px;color:var(--soft);font-size:13px}
@media(max-width:620px){dl{display:block}dt{padding-bottom:0;border-bottom:0}dd{border-top:0;padding-top:6px}}

</style>
</head>
<body>
<div class="top"><div><strong>Glucio</strong><a href="index.html" class=on>Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="support.html">Support</a></div></div>
<main>
<h1>Glucio</h1>
<p class="sub">Glucose log with a doctor-ready PDF</p>
<div class="ok">Log a reading in seconds, see mg/dL or mmol/L trends, and build a PDF for your next appointment.</div>
<dl>
<dt>Pages</dt><dd><p><a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a> &middot; <a href="support.html">Support</a></p></dd>
</dl>
</main>
<footer>Glucio · October 6, 2026 · <a href="mailto:netkaktakto@gmail.com">netkaktakto@gmail.com</a></footer>
</body>
</html>
